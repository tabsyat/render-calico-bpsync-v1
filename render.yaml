services:
  - type: web
    name: render-calico-sync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: RENDER_URL
        sync: false
      - key: RENDER_TOKEN
        sync: false
      - key: CALICO_URL
        sync: false
      - key: CALICO_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_PASSWORD
        sync: false
